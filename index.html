<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audio Visualizer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="viz"></canvas>

  <div id="stickerLayer" class="sticker-layer"></div>

  <canvas id="drawCanvas" class="draw-canvas"></canvas>

  <div id="textLayer" class="text-layer"></div>

  <p id="hint" class="hint">
    Click <a href="#" id="hintStart" class="hint-link">Start</a>, then in the picker choose the browser tab / window / screen
    that's playing audio, and make sure <strong>"Share audio"</strong> (or "Share tab audio") is checked.
  </p>

  <div id="gifDock" class="gif-dock">
    <span class="gif-dock-label">GIFs</span>

    <div class="gif-list">
      <div class="gif-item" data-src="assets/gifs/dancing-cat-kittens.gif" data-aspect="1" title="Dancing Cat Kittens">
        <img src="assets/gifs/dancing-cat-kittens.gif" alt="Dancing Cat Kittens" />
      </div>

      <div class="gif-item" data-src="assets/gifs/party-cat.gif" data-aspect="0.73125" title="Party Cat">
        <img src="assets/gifs/party-cat.gif" alt="Party Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/meow-zhe.gif" data-aspect="0.746606" title="Meow Zhe">
        <img src="assets/gifs/meow-zhe.gif" alt="Meow Zhe" />
      </div>

      <div class="gif-item" data-src="assets/gifs/cat.gif" data-aspect="0.8" title="Cat">
        <img src="assets/gifs/cat.gif" alt="Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/cat-feeding.gif" data-aspect="0.561798" title="Cat Feeding">
        <img src="assets/gifs/cat-feeding.gif" alt="Cat Feeding" />
      </div>

      <div class="gif-item" data-src="assets/gifs/dancing-cat-party.gif" data-aspect="1" title="Dancing Cat">
        <img src="assets/gifs/dancing-cat-party.gif" alt="Dancing Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/tarian-penarik.gif" data-aspect="0.564257" title="Tarian Penarik Finally Income">
        <img src="assets/gifs/tarian-penarik.gif" alt="Tarian Penarik Finally Income" />
      </div>

      <div class="gif-item" data-src="assets/gifs/rigby-cat-tongue.gif" data-aspect="0.566265" title="Rigby Cat Tongue">
        <img src="assets/gifs/rigby-cat-tongue.gif" alt="Rigby Cat Tongue" />
      </div>

      <div class="gif-item" data-src="assets/gifs/happy-cat.gif" data-aspect="0.639535" title="Happy Cat">
        <img src="assets/gifs/happy-cat.gif" alt="Happy Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/cat-cat-dance.gif" data-aspect="1" title="Cat Cat Dance">
        <img src="assets/gifs/cat-cat-dance.gif" alt="Cat Cat Dance" />
      </div>

      <div class="gif-item" data-src="assets/gifs/scuba-cat.gif" data-aspect="1" title="Scuba Cat">
        <img src="assets/gifs/scuba-cat.gif" alt="Scuba Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/ksungminz.gif" data-aspect="0.953815" title="Ksungminz Stan Twitter">
        <img src="assets/gifs/ksungminz.gif" alt="Ksungminz Stan Twitter" />
      </div>

      <div class="gif-item" data-src="assets/gifs/caleb-mahiru.gif" data-aspect="0.837989" title="Caleb Mahiru">
        <img src="assets/gifs/caleb-mahiru.gif" alt="Caleb Mahiru" />
      </div>

      <div class="gif-item" data-src="assets/gifs/fox-fox-girl.gif" data-aspect="1" title="Fox Fox Girl">
        <img src="assets/gifs/fox-fox-girl.gif" alt="Fox Fox Girl" />
      </div>

      <div class="gif-item" data-src="assets/gifs/fox-red-fox.gif" data-aspect="0.708835" title="Fox Red Fox">
        <img src="assets/gifs/fox-red-fox.gif" alt="Fox Red Fox" />
      </div>

      <div class="gif-item" data-src="assets/gifs/football-recording.gif" data-aspect="1.59615" title="Football Recording">
        <img src="assets/gifs/football-recording.gif" alt="Football Recording" />
      </div>

      <div class="gif-item" data-src="assets/gifs/chibi-chibi-cat.gif" data-aspect="0.902913" title="Chibi Chibi Cat">
        <img src="assets/gifs/chibi-chibi-cat.gif" alt="Chibi Chibi Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/scary.gif" data-aspect="1.07042" title="Scary">
        <img src="assets/gifs/scary.gif" alt="Scary" />
      </div>
    </div>
  </div>

  <div id="rightDock" class="right-dock">
    <span class="gif-dock-label">Draw</span>

    <button id="drawToolBtn" class="btn tool-btn" title="Brush" aria-label="Brush">&#9998;</button>
    <button id="eraseToolBtn" class="btn tool-btn" title="Eraser" aria-label="Eraser">&#9099;</button>
    <button id="textToolBtn" class="btn tool-btn" title="Text" aria-label="Text">T</button>
    <button id="clearDrawBtn" class="btn" title="Clear drawing" aria-label="Clear drawing">&#8635;</button>

    <div class="divider"></div>

    <div id="colorSwatches" class="color-swatches">
      <button class="swatch selected" data-color="#ffffff" style="background:#ffffff" title="White"></button>
      <button class="swatch" data-color="#e5e7eb" style="background:#e5e7eb" title="Light gray"></button>
      <button class="swatch" data-color="#94a3b8" style="background:#94a3b8" title="Gray"></button>
      <button class="swatch" data-color="#0f172a" style="background:#0f172a" title="Near black"></button>
      <button class="swatch" data-color="#ef4444" style="background:#ef4444" title="Red"></button>
      <button class="swatch" data-color="#f97316" style="background:#f97316" title="Orange"></button>
      <button class="swatch" data-color="#f59e0b" style="background:#f59e0b" title="Amber"></button>
      <button class="swatch" data-color="#eab308" style="background:#eab308" title="Yellow"></button>
      <button class="swatch" data-color="#84cc16" style="background:#84cc16" title="Lime"></button>
      <button class="swatch" data-color="#22c55e" style="background:#22c55e" title="Green"></button>
      <button class="swatch" data-color="#10b981" style="background:#10b981" title="Emerald"></button>
      <button class="swatch" data-color="#14b8a6" style="background:#14b8a6" title="Teal"></button>
      <button class="swatch" data-color="#06b6d4" style="background:#06b6d4" title="Cyan"></button>
      <button class="swatch" data-color="#3b82f6" style="background:#3b82f6" title="Blue"></button>
      <button class="swatch" data-color="#6366f1" style="background:#6366f1" title="Indigo"></button>
      <button class="swatch" data-color="#8b5cf6" style="background:#8b5cf6" title="Violet"></button>
      <button class="swatch" data-color="#d946ef" style="background:#d946ef" title="Fuchsia"></button>
      <button class="swatch" data-color="#ec4899" style="background:#ec4899" title="Pink"></button>
    </div>

    <div class="divider"></div>

    <label class="field slider-field">
      <span>Size</span>
      <input type="range" id="brushSizeSlider" min="2" max="60" value="14" />
    </label>

    <label class="field slider-field">
      <span>Hardness</span>
      <input type="range" id="brushHardnessSlider" min="0" max="100" value="40" />
    </label>
  </div>

  <div id="taskbar" class="taskbar">
    <button id="startBtn" class="btn primary" title="Start Capture" aria-label="Start Capture">&#9654;</button>
    <button id="stopBtn" class="btn" title="Stop" aria-label="Stop" disabled>&#9632;</button>

    <div class="divider"></div>

    <div class="field">
      <span>Style</span>
      <div id="styleDropdown" class="dropdown" data-value="solar">
        <button type="button" class="dropdown-trigger">
          <span class="dropdown-label">Solar Flare</span>
          <span class="dropdown-chevron">&#9662;</span>
        </button>
        <div class="dropdown-menu">
          <button type="button" class="dropdown-option selected" data-value="solar">Solar Flare</button>
          <button type="button" class="dropdown-option" data-value="bit8">8-Bit</button>
          <button type="button" class="dropdown-option" data-value="ascii">ASCII</button>
        </div>
      </div>
    </div>

    <div class="field">
      <span>Theme</span>
      <div id="themeDropdown" class="dropdown" data-value="complementary">
        <button type="button" class="dropdown-trigger">
          <span class="dropdown-label">Complementary</span>
          <span class="dropdown-chevron">&#9662;</span>
        </button>
        <div class="dropdown-menu">
          <button type="button" class="dropdown-option selected" data-value="complementary">Complementary</button>
          <button type="button" class="dropdown-option" data-value="triadic">Triadic</button>
          <button type="button" class="dropdown-option" data-value="analogous">Analogous</button>
          <button type="button" class="dropdown-option" data-value="sunset">Sunset</button>
          <button type="button" class="dropdown-option" data-value="aurora">Aurora</button>
          <button type="button" class="dropdown-option" data-value="mono">Mono</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <label class="field slider-field">
      <span>Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="50" />
    </label>
  </div>

  <script src="script.js"></script>
</body>
</html>
