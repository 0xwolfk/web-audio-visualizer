<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audio Visualizer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="viz"></canvas>

  <div id="stickerLayer" class="sticker-layer"></div>

  <p id="hint" class="hint">
    Click <a href="#" id="hintStart" class="hint-link">Start</a>, then in the picker choose the browser tab / window / screen
    that's playing audio, and make sure <strong>"Share audio"</strong> (or "Share tab audio") is checked.
  </p>

  <div id="gifDock" class="gif-dock">
    <span class="gif-dock-label">GIFs</span>

    <div class="gif-list">
      <div class="gif-item" data-src="assets/gifs/dancing-cat-kittens.gif" data-aspect="1" title="Dancing Cat Kittens">
        <img src="assets/gifs/dancing-cat-kittens.gif" alt="Dancing Cat Kittens" />
      </div>

      <div class="gif-item" data-src="assets/gifs/party-cat.gif" data-aspect="0.73125" title="Party Cat">
        <img src="assets/gifs/party-cat.gif" alt="Party Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/meow-zhe.gif" data-aspect="0.746606" title="Meow Zhe">
        <img src="assets/gifs/meow-zhe.gif" alt="Meow Zhe" />
      </div>

      <div class="gif-item" data-src="assets/gifs/cat.gif" data-aspect="0.8" title="Cat">
        <img src="assets/gifs/cat.gif" alt="Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/cat-feeding.gif" data-aspect="0.561798" title="Cat Feeding">
        <img src="assets/gifs/cat-feeding.gif" alt="Cat Feeding" />
      </div>

      <div class="gif-item" data-src="assets/gifs/dancing-cat-party.gif" data-aspect="1" title="Dancing Cat">
        <img src="assets/gifs/dancing-cat-party.gif" alt="Dancing Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/tarian-penarik.gif" data-aspect="0.564257" title="Tarian Penarik Finally Income">
        <img src="assets/gifs/tarian-penarik.gif" alt="Tarian Penarik Finally Income" />
      </div>

      <div class="gif-item" data-src="assets/gifs/rigby-cat-tongue.gif" data-aspect="0.566265" title="Rigby Cat Tongue">
        <img src="assets/gifs/rigby-cat-tongue.gif" alt="Rigby Cat Tongue" />
      </div>

      <div class="gif-item" data-src="assets/gifs/happy-cat.gif" data-aspect="0.639535" title="Happy Cat">
        <img src="assets/gifs/happy-cat.gif" alt="Happy Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/cat-cat-dance.gif" data-aspect="1" title="Cat Cat Dance">
        <img src="assets/gifs/cat-cat-dance.gif" alt="Cat Cat Dance" />
      </div>

      <div class="gif-item" data-src="assets/gifs/scuba-cat.gif" data-aspect="1" title="Scuba Cat">
        <img src="assets/gifs/scuba-cat.gif" alt="Scuba Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/ksungminz.gif" data-aspect="0.953815" title="Ksungminz Stan Twitter">
        <img src="assets/gifs/ksungminz.gif" alt="Ksungminz Stan Twitter" />
      </div>

      <div class="gif-item" data-src="assets/gifs/caleb-mahiru.gif" data-aspect="0.837989" title="Caleb Mahiru">
        <img src="assets/gifs/caleb-mahiru.gif" alt="Caleb Mahiru" />
      </div>

      <div class="gif-item" data-src="assets/gifs/fox-fox-girl.gif" data-aspect="1" title="Fox Fox Girl">
        <img src="assets/gifs/fox-fox-girl.gif" alt="Fox Fox Girl" />
      </div>

      <div class="gif-item" data-src="assets/gifs/fox-red-fox.gif" data-aspect="0.708835" title="Fox Red Fox">
        <img src="assets/gifs/fox-red-fox.gif" alt="Fox Red Fox" />
      </div>

      <div class="gif-item" data-src="assets/gifs/football-recording.gif" data-aspect="1.59615" title="Football Recording">
        <img src="assets/gifs/football-recording.gif" alt="Football Recording" />
      </div>

      <div class="gif-item" data-src="assets/gifs/chibi-chibi-cat.gif" data-aspect="0.902913" title="Chibi Chibi Cat">
        <img src="assets/gifs/chibi-chibi-cat.gif" alt="Chibi Chibi Cat" />
      </div>

      <div class="gif-item" data-src="assets/gifs/scary.gif" data-aspect="1.07042" title="Scary">
        <img src="assets/gifs/scary.gif" alt="Scary" />
      </div>
    </div>
  </div>

  <div id="taskbar" class="taskbar">
    <button id="startBtn" class="btn primary" title="Start Capture" aria-label="Start Capture">&#9654;</button>
    <button id="stopBtn" class="btn" title="Stop" aria-label="Stop" disabled>&#9632;</button>

    <div class="divider"></div>

    <label class="field">
      <span>Style</span>
      <select id="styleSelect">
        <option value="solar">Solar Flare</option>
        <option value="bit8">8-Bit</option>
        <option value="ascii">ASCII</option>
      </select>
    </label>

    <label class="field">
      <span>Theme</span>
      <select id="themeSelect">
        <option value="complementary">Complementary</option>
        <option value="triadic">Triadic</option>
        <option value="analogous">Analogous</option>
        <option value="sunset">Sunset</option>
        <option value="aurora">Aurora</option>
        <option value="mono">Mono</option>
      </select>
    </label>

    <div class="divider"></div>

    <label class="field slider-field">
      <span>Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="50" />
    </label>
  </div>

  <script src="script.js"></script>
</body>
</html>
