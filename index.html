<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audio Visualizer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="viz"></canvas>

  <div id="stickerLayer" class="sticker-layer"></div>

  <p id="hint" class="hint">
    Click <strong>Start</strong>, then in the picker choose the browser tab / window / screen
    that's playing audio, and make sure <strong>"Share audio"</strong> (or "Share tab audio") is checked.
  </p>

  <div id="gifDock" class="gif-dock">
    <span class="gif-dock-label">GIFs</span>

    <div class="gif-list">
      <div class="gif-item" data-postid="2365280150084947402" data-aspect="1" title="Dancing Cat Kittens">

      </div>

      <div class="gif-item" data-postid="18024290" data-aspect="0.73125" title="Party Cat">

      </div>

      <div class="gif-item" data-postid="3425511735001074164" data-aspect="0.8" title="Cat">
        <div class="tenor-gif-embed" data-postid="3425511735001074164" data-share-method="host" data-aspect-ratio="0.8" data-width="100%"></div>
      </div>

      <div class="gif-item" data-postid="9260780017906956026" data-aspect="0.561798" title="Cat Feeding">

      </div>

      <div class="gif-item" data-postid="8721537877361682135" data-aspect="1" title="Dancing Cat">
        <div class="tenor-gif-embed" data-postid="8721537877361682135" data-share-method="host" data-aspect-ratio="1" data-width="100%"></div>
      </div>

      <div class="gif-item" data-postid="7788421377443289845" data-aspect="0.564257" title="Tarian Penarik Finally Income">
        <div class="tenor-gif-embed" data-postid="7788421377443289845" data-share-method="host" data-aspect-ratio="0.564257" data-width="100%"></div>

      <div class="gif-item" data-postid="8850150248783058180" data-aspect="0.566265" title="Rigby Cat Tongue">

      <div class="gif-item" data-postid="10804346947536782797" data-aspect="0.639535" title="Happy Cat">

      <div class="gif-item" data-postid="13209213688820595837" data-aspect="1" title="Cat Cat Dance">

      <div class="gif-item" data-postid="18241168156512957760" data-aspect="1" title="Scuba Cat">

      </div>
    </div>
  </div>

  <div id="taskbar" class="taskbar">
    <button id="startBtn" class="btn primary" title="Start Capture" aria-label="Start Capture">&#9654;</button>
    <button id="stopBtn" class="btn" title="Stop" aria-label="Stop" disabled>&#9632;</button>

    <div class="divider"></div>

    <label class="field">
      <span>Style</span>
      <select id="styleSelect">
        <option value="solar">Solar Flare</option>
        <option value="bit8">8-Bit</option>
        <option value="ascii">ASCII</option>
      </select>
    </label>

    <label class="field">
      <span>Theme</span>
      <select id="themeSelect">
        <option value="complementary">Complementary</option>
        <option value="triadic">Triadic</option>
        <option value="analogous">Analogous</option>
        <option value="sunset">Sunset</option>
        <option value="aurora">Aurora</option>
        <option value="mono">Mono</option>
      </select>
    </label>

    <div class="divider"></div>

    <label class="field slider-field">
      <span>Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="50" />
    </label>
  </div>

  <script async src="https://tenor.com/embed.js"></script>
  <script src="script.js"></script>
</body>
</html>
